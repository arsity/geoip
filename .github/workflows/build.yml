name: Build geoip files
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - master
    paths-ignore:
      - "assets/*"
      - ".gitignore"
      - "LICENSE*"
      - "*.md"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "assets/*"
      - ".gitignore"
      - "LICENSE*"
      - "*.md"
permissions:
  contents: read
jobs:
  test:
    name: Offline regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ./go.mod
          cache-dependency-path: ./go.sum
      - name: Test converters, network failures, and output compatibility
        run: |
          go test -race -count=1 ./...
          go vet ./...
      - name: Test verified IPinfo downloads without credentials
        run: |
          bash -n scripts/download-ipinfo.sh
          python3 -m unittest discover -s scripts -p 'test_*.py' -v

  build:
    name: Build
    needs: test
    # External fork PRs only run offline tests; they receive no IPinfo secret.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ./go.mod
          cache-dependency-path: ./go.sum

      - name: Set variables
        run: |
          echo "TAG_NAME=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV
          echo "RELEASE_NAME=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV
        shell: bash

      - name: Download and verify IPInfo Lite databases
        env:
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
        run: |
          mkdir -p output
          bash scripts/download-ipinfo.sh ./ipinfo

      - name: Prepare IPInfo Lite databases
        run: |
          cd ipinfo
          gunzip ipinfo_lite.csv.gz
          cp ipinfo_lite.mmdb ../output/

      - name: Build geoip files
        run: |
          go build ./
          ./geoip convert -c ./config.json

      - name: Verify output manifest and lookup semantics
        env:
          GEOIP_VERIFY_OUTPUT_DIR: ${{ github.workspace }}/output
        run: go test . -run '^TestReleaseOutputs$' -count=1 -v

      - name: Verify mmdb files
        run: |
          cd ./output || exit 1
          go install -v github.com/maxmind/mmdbverify@latest
          for name in $(ls *.mmdb); do
            $(go env GOPATH)/bin/mmdbverify -file ${name}
          done

      - name: Generate sha256 checksum for dat files
        run: |
          cd ./output || exit 1
          for name in $(ls *.dat); do
            sha256sum ${name} > ./${name}.sha256sum
          done

      - name: Generate sha256 checksum for mmdb files
        run: |
          cd ./output || exit 1
          for name in $(ls *.mmdb); do
            sha256sum ${name} > ./${name}.sha256sum
          done

      - name: Git push assets to "release" branch
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cd output || exit 1
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add -A
          git commit -m "${RELEASE_NAME}"
          gh auth setup-git --hostname github.com
          git remote add geoip "https://github.com/${REPOSITORY}.git"
          git push -f -u geoip release

      - name: Purge jsdelivr CDN
        if: github.event_name != 'pull_request'
        run: |
          cd output || exit 1
          for file in $(ls); do
            curl -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/${file}"
          done

      - name: Remove some files to avoid publishing to GitHub release
        if: github.event_name != 'pull_request'
        run: |
          rm -rf ./output/*.{gz,zip}
          rm -rf ./output/ipinfo_lite.mmdb
          rm -rf ./output/ipinfo_lite.mmdb.sha256sum
          rm -rf ./output/{clash,dat,mrs,nginx,srs,surge,text}

      - name: Upload files to GitHub release
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ env.TAG_NAME }} --title "${{ env.RELEASE_NAME }}" ./output/*
